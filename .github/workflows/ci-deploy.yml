name: CI / Deploy

on:
  push:
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # CI — runs on every push and every PR targeting main
  # ---------------------------------------------------------------------------
  ci:
    name: Lint → Test → Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Biome — check formatting & lint
        run: npm run check
        # Biome exits non-zero on any lint error or formatting violation.
        # Fix locally with: npm run format

      - name: Run tests
        run: npm test
        # Vitest exits non-zero on any failing test.
        # Run locally with: npm run test:watch

      - name: Build
        run: npm run build
        # Vite exits non-zero if any module fails to bundle.
        # The dist/ folder is the deployable artifact.

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Deploy — runs ONLY when ci passes on the main branch
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy → Cloudflare Pages
    needs: ci
    # Guard: only deploy from main, not feature branches or PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must match the project name you create in Cloudflare Pages dashboard.
          # https://dash.cloudflare.com -> Workers & Pages -> Create application -> Pages
          projectName: bikepacker-navigator
          directory: dist
          # Wires GitHub deployments API so each deploy shows in the PR/commit UI
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
